name: Weekly SEO Claude

on:
  schedule:
    - cron: "0 8 * * 1"
      timezone: "Europe/Brussels"
  workflow_dispatch:
    inputs:
      force:
        description: "Run again even if today's SEO report already exists"
        required: false
        default: false
        type: boolean

concurrency:
  group: weekly-seo-claude
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

jobs:
  weekly-seo:
    if: github.event_name == 'workflow_dispatch' || vars.SEO_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      SEO_BASE_URL: https://www.isoprotech.be
      GSC_SITE_URL: ${{ vars.GSC_SITE_URL || 'sc-domain:isoprotech.be' }}
      GOOGLE_ADS_CUSTOMER_ID: "1501901578"
      GOOGLE_ADS_API_VERSION: v25
      GOOGLE_ADC_JSON: ${{ secrets.GOOGLE_ADC_JSON }}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}

    steps:
      - name: Skip duplicate same-day run
        id: duplicate
        env:
          FORCE_RUN: ${{ inputs.force || 'false' }}
        run: |
          TODAY="$(TZ=Europe/Brussels date +%F)"
          if [ "$FORCE_RUN" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          COUNT="$(gh issue list --repo "$GITHUB_REPOSITORY" --search "SEO Weekly — ${TODAY} in:title" --limit 1 --json number --jq 'length')"
          if [ "$COUNT" != "0" ]; then
            echo "Existing SEO Weekly report found for ${TODAY}; skipping duplicate paid analysis."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.duplicate.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        if: steps.duplicate.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SEO collector dependencies
        if: steps.duplicate.outputs.skip != 'true'
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Collect weekly SEO evidence
        if: steps.duplicate.outputs.skip != 'true'
        run: python isoprotech-2/scripts/seo_weekly_collect.py

      - name: Validate SEO evidence before paid Claude run
        if: steps.duplicate.outputs.skip != 'true'
        id: evidence
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          p = Path('seo-weekly-context.json')
          out = Path(os.environ['GITHUB_OUTPUT'])
          if not p.exists():
              ready = False
              reason = 'SEO evidence file was not created.'
              warning = ''
          else:
              data = json.loads(p.read_text(encoding='utf-8'))
              gsc_error = (data.get('gsc') or {}).get('error') if isinstance(data.get('gsc'), dict) else None
              ads_error = (data.get('google_ads') or {}).get('error') if isinstance(data.get('google_ads'), dict) else None
              audit_error = (data.get('site_audit') or {}).get('error') if isinstance(data.get('site_audit'), dict) else None

              # GSC is the required organic-performance source. Never pay Claude if it is unavailable.
              ready = not bool(gsc_error)
              if gsc_error:
                  reason = 'Google Search Console authentication/data failed; Claude was not started, so API cost is $0.'
              else:
                  reason = ''
              warnings = []
              if ads_error:
                  warnings.append('Google Ads data unavailable; run may continue using GSC + site audit.')
              if audit_error:
                  warnings.append('Live site audit unavailable; run may continue using GSC.')
              warning = ' '.join(warnings)

          with out.open('a', encoding='utf-8') as f:
              f.write(f"claude_ready={'true' if ready else 'false'}\n")
              f.write(f"reason={reason}\n")
              f.write(f"warning={warning}\n")
          print('Claude ready:', ready)
          if reason:
              print(reason)
          if warning:
              print(warning)
          PY

      - name: Build compact Claude context
        if: steps.duplicate.outputs.skip != 'true' && steps.evidence.outputs.claude_ready == 'true'
        run: python isoprotech-2/scripts/seo_weekly_compact.py

      - name: Upload raw weekly evidence
        if: steps.duplicate.outputs.skip != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-weekly-context-${{ github.run_id }}
          path: |
            seo-weekly-context.json
            seo-weekly-context-compact.json
          if-no-files-found: warn
          retention-days: 30

      - name: Verify Claude authentication is configured
        if: steps.duplicate.outputs.skip != 'true' && steps.evidence.outputs.claude_ready == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "Missing Claude authentication. Add ANTHROPIC_API_KEY in repository Actions secrets."
            exit 1
          fi

      - name: Run Claude weekly SEO agent
        if: steps.duplicate.outputs.skip != 'true' && steps.evidence.outputs.claude_ready == 'true'
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            This is the scheduled ISOPROTECH weekly SEO run. Determine today's date in Europe/Brussels when naming the report.

            Read `.claude/agents/weekly-seo.md` in full and follow it as the governing policy.
            Read `isoprotech-2/seo/business_profile.json` as the business source of truth.
            Read `seo-weekly-context-compact.json` as the fresh evidence for this run.

            Cost control is important. Never read the large raw context unless the compact context explicitly reports a critical missing fact needed for one concrete decision.
            By turn 6, choose the likely mode and the single highest-confidence finding. If there is no concrete SAFE FIX or approval-gated opportunity, create the required issue and finish immediately.
            Inspect repository files only for that one concrete finding. Do not browse broadly, do not restate metrics, and do not investigate secondary opportunities in this run.
            Check recent open SEO issues/PRs only enough to avoid duplicate work.

            Finish in exactly one mode: NO ACTION, MONITOR, SAFE FIX, or NEEDS APPROVAL.
            SAFE FIX: smallest diff only, QA it, and auto-merge to main only if the entire diff is allowed by safe_auto_publish.
            NEEDS APPROVAL: create the review PR/approval package required by policy but never merge it without explicit owner approval.

            Always create the required `SEO Weekly — YYYY-MM-DD — <MODE>` issue before finishing.
            If Google Ads or site-audit data is missing but GSC is valid, continue conservatively and mention the missing source briefly.
          claude_args: |
            --model claude-sonnet-5
            --effort medium
            --max-turns 16
            --max-budget-usd 1.00
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(gh:*),Bash(npm:*),Bash(npx:*),Bash(python:*),Bash(python3:*),Bash(cat:*),Bash(pwd),Bash(ls:*)"

      - name: Send Telegram SEO summary
        if: steps.duplicate.outputs.skip != 'true' && always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          EVIDENCE_READY: ${{ steps.evidence.outputs.claude_ready }}
          EVIDENCE_REASON: ${{ steps.evidence.outputs.reason }}
          EVIDENCE_WARNING: ${{ steps.evidence.outputs.warning }}
        run: python isoprotech-2/scripts/seo_weekly_notify.py
