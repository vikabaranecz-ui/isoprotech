name: Weekly SEO Claude

on:
  schedule:
    - cron: "0 8 * * 1"
      timezone: "Europe/Brussels"
  workflow_dispatch:
    inputs:
      force:
        description: "Run again even if today's SEO report already exists"
        required: false
        default: false
        type: boolean

concurrency:
  group: weekly-seo-claude
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

jobs:
  weekly-seo:
    if: github.event_name == 'workflow_dispatch' || vars.SEO_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      SEO_BASE_URL: https://www.isoprotech.be
      GSC_SITE_URL: ${{ vars.GSC_SITE_URL || 'sc-domain:isoprotech.be' }}
      GOOGLE_ADS_CUSTOMER_ID: "1501901578"
      GOOGLE_ADS_API_VERSION: v25
      GOOGLE_ADC_JSON: ${{ secrets.GOOGLE_ADC_JSON }}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}

    steps:
      - name: Skip duplicate same-day run
        id: duplicate
        env:
          FORCE_RUN: ${{ inputs.force || 'false' }}
        run: |
          TODAY="$(TZ=Europe/Brussels date +%F)"
          if [ "$FORCE_RUN" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          REPORTS="$(gh issue list --repo "$GITHUB_REPOSITORY" --search "SEO Weekly — ${TODAY} in:title" --limit 20 --json title --jq '.[].title')"
          if [ -n "$REPORTS" ] && echo "$REPORTS" | grep -qv "AUTO-PUBLISH FAILED"; then
            echo "Existing completed/non-failed SEO Weekly report found for ${TODAY}; skipping duplicate paid analysis."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            if [ -n "$REPORTS" ]; then
              echo "Only failed SEO Weekly report(s) found for ${TODAY}; allowing retry."
            fi
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.duplicate.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        if: steps.duplicate.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SEO collector dependencies
        if: steps.duplicate.outputs.skip != 'true'
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 google-auth

      - name: Collect weekly SEO evidence
        if: steps.duplicate.outputs.skip != 'true'
        run: python isoprotech-2/scripts/seo_weekly_collect_service.py

      - name: Validate SEO evidence before paid Claude run
        if: steps.duplicate.outputs.skip != 'true'
        id: evidence
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          p = Path('seo-weekly-context.json')
          out = Path(os.environ['GITHUB_OUTPUT'])
          if not p.exists():
              ready = False
              reason = 'SEO evidence file was not created.'
              warning = ''
          else:
              data = json.loads(p.read_text(encoding='utf-8'))
              gsc_error = (data.get('gsc') or {}).get('error') if isinstance(data.get('gsc'), dict) else None
              ads_error = (data.get('google_ads') or {}).get('error') if isinstance(data.get('google_ads'), dict) else None
              audit_error = (data.get('site_audit') or {}).get('error') if isinstance(data.get('site_audit'), dict) else None
              ready = not bool(gsc_error)
              reason = 'Google Search Console authentication/data failed; Claude was not started, so API cost is $0.' if gsc_error else ''
              warnings = []
              if ads_error:
                  warnings.append('Google Ads data unavailable; run may continue using GSC + site audit.')
              if audit_error:
                  warnings.append('Live site audit unavailable; run may continue using GSC.')
              warning = ' '.join(warnings)

          with out.open('a', encoding='utf-8') as f:
              f.write(f"claude_ready={'true' if ready else 'false'}\n")
              f.write(f"reason={reason}\n")
              f.write(f"warning={warning}\n")
          print('Claude ready:', ready)
          if reason:
              print(reason)
          if warning:
              print(warning)
          PY

      - name: Build compact Claude context
        if: steps.duplicate.outputs.skip != 'true' && steps.evidence.outputs.claude_ready == 'true'
        run: python isoprotech-2/scripts/seo_weekly_compact.py

      - name: Upload raw weekly evidence
        if: steps.duplicate.outputs.skip != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-weekly-context-${{ github.run_id }}
          path: |
            seo-weekly-context.json
            seo-weekly-context-compact.json
          if-no-files-found: warn
          retention-days: 30

      - name: Verify Claude authentication is configured
        if: steps.duplicate.outputs.skip != 'true' && steps.evidence.outputs.claude_ready == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "Missing Claude authentication. Add ANTHROPIC_API_KEY in repository Actions secrets."
            exit 1
          fi

      - name: Run Claude weekly SEO agent
        if: steps.duplicate.outputs.skip != 'true' && steps.evidence.outputs.claude_ready == 'true'
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          show_full_output: true
          allowed_bots: "github-actions[bot]"
          prompt: |
            This is the scheduled ISOPROTECH weekly SEO growth run. Determine today's date in Europe/Brussels when naming the report.

            Read `.claude/agents/weekly-seo.md` in full and follow it as the governing policy.
            Also read `.claude/agents/isoprotech-fast-growth.md` and apply it as an additional prioritization overlay without overriding safety or approval rules.
            Also read `.claude/agents/isoprotech-roof-recovery.md` and apply it while roof visibility remains weak.
            Also read `.claude/agents/isoprotech-conversion-growth.md` and use it to maintain whole-market coverage and conversion-first content quality.
            Read `isoprotech-2/seo/business_profile.json`, `isoprotech-2/seo/growth_strategy.json`, `isoprotech-2/seo/keyword_targets.json`, and `seo-weekly-context-compact.json`.

            The business KPI is 40 commercially relevant queries in Google Top 5 by 2026-12-31. Treat this as the operating target, not a guaranteed result.
            Execute ONE comprehensive weekly MASTER SEO + CONVERSION RUN spanning 3-5 evidence-backed keyword/service clusters when enough actionable opportunities exist. Do not treat this as a narrow one- or two-keyword task.

            Before choosing changes, audit the full 40-query scoreboard plus secondary GSC opportunities across roof, facade, local, problem, economic, comfort and seasonal intent. Check query-to-page mapping, cannibalization, internal authority, technical health, content usefulness, CTA/form journey and recent sprint history.

            Then execute the strongest evidence-backed portfolio. A master run should normally include:
            1) 3-5 active keyword/service clusters, prioritizing commercially valuable near-wins around positions 5-15,
            2) at least one dak move and one gevel move when both pillars have material opportunities,
            3) supporting internal-authority/cannibalization work where justified,
            4) conversion/trust improvements on the same customer journeys where safe,
            5) a coverage-gap register for roof, facade, problem/decision and conversion gaps,
            6) a clear next checkpoint for each active cluster, including off-page authority where that is the real bottleneck.
            Keep roof visibility a priority while it remains weak, but do not ignore a clearly stronger near-win elsewhere. Do not publish filler text. Every changed paragraph must improve intent coverage, buyer understanding, trust or conversion.
            Consider commercial, problem, economic, comfort and seasonal demand. Seasonal content should be prepared 4-8 weeks before the expected peak.
            If the highest-value move is a new article/page, merge, redirect or other approval-gated action, prepare the PR and send it through Telegram approval rather than substituting a trivial safe fix.

            Complete the sprint fully. For SAFE FIX, QA, push the branch, open the PR, and auto-merge every safe change to main; do not end the run with safe changes only in the runner working tree. For NEEDS APPROVAL, push the branch, open the exact QA'd PR, and never merge it yourself. If analysis justifies no code/content change, still create the required NO ACTION or MONITOR weekly issue. Never finish without a weekly issue.
            Before ending, verify there are no uncommitted intended changes left in the runner and that every intended SAFE FIX is present in main or every approval-gated change is present in an open PR.
            Always create `SEO Weekly — YYYY-MM-DD — <MODE>` with Top-5 progress X/40, sprint cluster and concrete completed work.
          claude_args: |
            --model claude-sonnet-5
            --effort high
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(gh:*),Bash(npm:*),Bash(npx:*),Bash(python:*),Bash(python3:*),Bash(cat:*),Bash(pwd),Bash(ls:*)"

      - name: Verify weekly SEO completion contract
        if: steps.duplicate.outputs.skip != 'true' && steps.evidence.outputs.claude_ready == 'true'
        env:
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
        shell: bash
        run: |
          TODAY="$(TZ=Europe/Brussels date +%F)"
          ISSUE_COUNT="$(gh issue list --repo "$GITHUB_REPOSITORY" --search "SEO Weekly — ${TODAY} in:title" --limit 20 --json number --jq 'length')"
          if [ "$ISSUE_COUNT" = "0" ]; then
            echo "::error::Claude finished without creating the required SEO Weekly report."
            exit 1
          fi
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "::error::Claude left uncommitted intended changes in the runner. Weekly SEO is incomplete."
            git status --short
            exit 1
          fi

      - name: Send Telegram SEO summary
        if: steps.duplicate.outputs.skip != 'true' && always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          EVIDENCE_READY: ${{ steps.evidence.outputs.claude_ready }}
          EVIDENCE_REASON: ${{ steps.evidence.outputs.reason }}
          EVIDENCE_WARNING: ${{ steps.evidence.outputs.warning }}
        run: python isoprotech-2/scripts/seo_weekly_notify.py
