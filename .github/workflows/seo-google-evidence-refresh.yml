name: ISOPROTECH Google SEO Evidence Refresh (read only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'isoprotech-2/scripts/seo_*.py'
      - '.claude/agents/weekly-seo.md'
      - '.github/workflows/seo-google-evidence-refresh.yml'

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SEO_BASE_URL: https://www.isoprotech.be
      GSC_SITE_URL: sc-domain:isoprotech.be
      GOOGLE_ADC_JSON: ${{ secrets.GOOGLE_ADC_JSON }}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
      GOOGLE_ADS_CUSTOMER_ID: '1501901578'
      GOOGLE_ADS_API_VERSION: v25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Google collector dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 google-auth
      - name: Compile changed SEO scripts
        run: |
          python -m py_compile isoprotech-2/scripts/seo_weekly_collect.py
          python -m py_compile isoprotech-2/scripts/seo_weekly_collect_service.py
          python -m py_compile isoprotech-2/scripts/seo_google_ads_dual_geo.py
          python -m py_compile isoprotech-2/scripts/seo_weekly_compact.py
          python -m py_compile isoprotech-2/scripts/seo_indexing_audit.py
      - name: Collect current Search Console and Keyword Planner evidence
        run: python isoprotech-2/scripts/seo_weekly_collect_service.py
      - name: Inspect Google index status of priority pages (read only)
        continue-on-error: true
        run: python isoprotech-2/scripts/seo_indexing_audit.py
      - name: Prepare compact keyword and ranking evidence
        run: python isoprotech-2/scripts/seo_weekly_compact.py
      - name: Summarize API evidence (never claim failed/absent data is zero)
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path("seo-weekly-context.json").read_text(encoding="utf-8"))
          gsc=data.get("gsc") or {}
          ads=data.get("google_ads") or {}
          audit=json.loads(Path("seo-indexing-audit.json").read_text(encoding="utf-8")) if Path("seo-indexing-audit.json").exists() else {}
          gsc_ok=not gsc.get("error") and bool(gsc.get("periods"))
          local=ads.get("local") or {}
          local_ok=isinstance(local,dict) and not local.get("error") and "ideas" in local
          print("GSC", "OK" if gsc_ok else "UNAVAILABLE", gsc.get("error",""))
          print("Antwerp Keyword Planner", "OK" if local_ok else "UNAVAILABLE", local.get("error","") if isinstance(local,dict) else "")
          print("URL Inspection checked", audit.get("inspected_urls","UNAVAILABLE"))
          lines=["## Current authenticated Google SEO evidence",
                 f"- GSC: {'PASS' if gsc_ok else 'FAILED / UNVERIFIED'}",
                 f"- Antwerp Keyword Planner: {'PASS' if local_ok else 'FAILED / UNVERIFIED'}",
                 f"- Google URL Inspection: {audit.get('inspected_urls','UNAVAILABLE')} URLs",
                 "- Planner volumes are historical monthly estimates; not searches happening right now"]
          if gsc_ok:
              summary=(gsc.get("summary") or {}).get("current_28d") or {}
              lines.append(f"- GSC 28d clicks / impressions: {summary.get('clicks','unknown')} / {summary.get('impressions','unknown')}")
          if local_ok:
              ideas=(local.get("ideas") or [])
              for row in ideas[:6]:
                  lines.append(f"- Keyword: {row.get('keyword')} — Antwerp {row.get('avg_monthly_searches','unknown')}/mo, latest history {row.get('trend_observation_end') or 'not returned'}")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("\n".join(lines)+"\n")
          if not gsc_ok or not local_ok:
              raise SystemExit("Required Google evidence unavailable; do not claim successful keyword discovery.")
          PY
      - name: Store evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isoprotech-google-seo-evidence-${{ github.run_id }}
          path: |
            seo-weekly-context.json
            seo-weekly-context-compact.json
            seo-indexing-audit.json
          if-no-files-found: warn
          retention-days: 30
