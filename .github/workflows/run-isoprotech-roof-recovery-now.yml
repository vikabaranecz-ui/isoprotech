name: Run Isoprotech Roof Recovery Now
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/run-isoprotech-roof-recovery-now.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Isoprotech SEO now
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run weekly-seo-claude.yml --repo "$GITHUB_REPOSITORY" -f force=true
